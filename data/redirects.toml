# Permanent site URL migrations. Deployment adapters translate these rules
# into provider-specific configuration.
# Keep both path forms because the legacy URLs were served with and without
# a trailing slash.
[[rules]]
source = "/p/wsl-automng"
destination = "/p/swaw-kit-wsl-release/"
status = 301

[[rules]]
source = "/p/wsl-automng/"
destination = "/p/swaw-kit-wsl-release/"
status = 301

[[rules]]
source = "/zh/p/wsl-automng"
destination = "/zh/p/swaw-kit-wsl-release/"
status = 301

[[rules]]
source = "/zh/p/wsl-automng/"
destination = "/zh/p/swaw-kit-wsl-release/"
status = 301

[[rules]]
source = "/zh-tw/p/wsl-automng"
destination = "/zh-tw/p/swaw-kit-wsl-release/"
status = 301

[[rules]]
source = "/zh-tw/p/wsl-automng/"
destination = "/zh-tw/p/swaw-kit-wsl-release/"
status = 301

# Updates now owns the former PWA and site entry pages.
[[rules]]
